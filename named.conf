options {
    directory "zones";
    listen-on port 2222 {127.0.0.1; };
    listen-on-v6 { none; };

    forwarders {
        8.8.8.8;
        1.1.1.1;
    };

    resolver {
        timeout 2000;
        max-retries 2;
        retry-delay 100;
        strategy round-robin;
    };
};

zone "example.com" {
    type primary;
    file "db.example.com";
};

zone "0.0.129.in-addr-arpa" {
    type primary;
    file "db.129.0.0";
};