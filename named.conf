logging {
    channel default_log {
        file "log/named.log" versions 0 size 200k;
        severity info;
        print-time yes;
        print-category yes;
        print-severity yes;
    };

    channel error_log {
        file "log/named-error.log" versions 3 size 200k;
        severity critical;
        print-time yes;
        print-category yes;
        print-severity yes;
    };

    channel query_log {
        file "log/queries.log" versions 0 size 200k;
        severity info;
    };

    channel trace_log {
        file "log/trace.log" versions 0 size 200k;
        severity info;
        print-time yes;
    };

    category default {
        default_log;
        error_log;
    };
    category general {
        default_log;
        error_log;
    };
    category config {
        default_log;
        error_log;
    };

    category queries {
        query_log;
        error_log;
    };

    category trace {
        trace_log;
    };

    category query-errors { error_log; };
};

options {
    directory "zones"; # the directory where zones are stored, starting from the project root
    listen-on port 2222 {127.0.0.1; }; # do not use port 8000 or port 5173, they are used for the dashboard and dashboard api
    listen-on-v6 port { none; };

    # Allow dnssec
    dnssec-enable yes;
    ## dnssec-enable no;

    # Validate dnssec, validation isn't supported yet
    ## dnssec-validation yes;
    dnssec-validation no;

    # Configure the maximum edns size for responses sent over UDP
    edns-udp-size 2500;

    recursion yes; # Allows resolving queries either by forwarding or recursively resolving
    ## recursion no; # Never resolve anything. Only answers local zones

    # if 'forward' option is commented out, never forward, resolve everything yourself
    ## forward only; # Never resolve yourself, only forward
    ## forward first; # Try forwarding first, if unsuccessful, resolve yourself

    # Servers used by the stub resolver
    forwarders {
        8.8.8.8;
        1.1.1.1;
    };

    # Stub resolver fine tune settings. They are optional and not part of BIND
    resolver {
        timeout 1000;
        max-retries 2;
        retry-delay 50;
        strategy round-robin;
    };
};

# A forward zone example
zone "example.com" {
    type primary;
    file "db.example.com.signed";
};

# A backwards zone example
zone "0.0.129.in-addr.arpa" {
    type primary;
    file "db.129.0.0";
};

# Demo zone for round-robin load balancing
zone "loadbalancer.test" {
    type primary;
    file "db.loadbalancer.test";
};