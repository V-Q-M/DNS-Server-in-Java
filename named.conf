options {
    directory "zones"; # the directory where zones are stored
    listen-on port 2222 {127.0.0.1; };
    listen-on-v6 port { none; };

    recursion yes; # Allows resolving queries either by forwarding or recursively resolving
    #recursion no; # Never resolve anything. Only answers local zones

    # if 'forward' option is left out, never forward, resolve everything yourself
    #forward only; # Never resolve yourself, only forward
    #forward first; # Try forwarding first, if unsuccessful, resolve yourself

    # Servers used by the stub resolver
    forwarders {
        8.8.8.8;
        1.1.1.1;
    };

    # Stub resolver fine tune settings. They are optional and not part of BIND
    resolver {
        timeout 2000;
        max-retries 2;
        retry-delay 100;
        strategy round-robin;
    };
};

# A forward zone example
zone "example.com" {
    type primary;
    file "db.example.com";
};

# A backwards zone example
zone "0.0.129.in-addr.arpa" {
    type primary;
    file "db.129.0.0";
};