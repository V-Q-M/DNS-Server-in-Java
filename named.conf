logging {
    channel default_log {
        file "log/named.log";
        severity info;
        print-time yes;
        print-category yes;
        print-severity yes;
    };

    channel error_log {
        file "log/named-error.log";
        severity critical;
        print-time yes;
        print-category yes;
        print-severity yes;
    };

    channel query_log {
        file "log/queries.log";
        severity info;
    };

    channel trace_log {
        file "log/trace.log";
        severity info;
        print-time yes;
    };

    category default {
        default_log;
        error_log;
    };
    category general {
        default_log;
        error_log;
    };
    category config {
        default_log;
        error_log;
    };

    category queries {
        query_log;
        error_log;
    };

    category trace {
        trace_log;
    };

    category query-errors { error_log; };
};

options {
    directory "zones"; # the directory where zones are stored
    listen-on port 2222 {127.0.0.1; };
    listen-on-v6 port { none; };

    recursion yes; # Allows resolving queries either by forwarding or recursively resolving
    #recursion no; # Never resolve anything. Only answers local zones

    # if 'forward' option is left out, never forward, resolve everything yourself
    #forward only; # Never resolve yourself, only forward
    #forward first; # Try forwarding first, if unsuccessful, resolve yourself

    # Servers used by the stub resolver
    forwarders {
        8.8.8.8;
        1.1.1.1;
    };

    # Stub resolver fine tune settings. They are optional and not part of BIND
    resolver {
        timeout 2000;
        max-retries 2;
        retry-delay 100;
        strategy round-robin;
    };
};

# A forward zone example
zone "example.com" {
    type primary;
    file "db.example.com.signed";
};

# A backwards zone example
zone "0.0.129.in-addr.arpa" {
    type primary;
    file "db.129.0.0";
};