services:
  # Postgres Database image
  db: 
    image: postgres
    container_name: postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: dns

    # portmapping for the container
    # 1337:5432 maps Port 1337 of the host to Port 5432 of the container.
    ports:
      - 5432:5432

    # Bind mounts, mounting the external config files into the docker
    # Bind mounts take the form relative_path_on_host:absolute_path_in_docker:options 
    # Options are mount options, limiting what a container can do to a mounted file or directory. 
    # ro for example stands for Readonly 
    volumes:
      - ./postgres/postgres.conf:/etc/postgresql/postgresql.conf:ro
      # .sql and .sh scripts mounted to docker-entrypoint-initdb.d will be executed on docker startup
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d:ro

    # To add other postgres config files, simply add them in the postgres folder, 
    # mount them to /etc/postgresql/ and follow the instructions in postres.conf

    # Commands to be executed once the docker has started up
    command: postgres -c config_file=/etc/postgresql/postgresql.conf

  # Simple webpage overview, to allow easy debugging acces to the database
  # hosted on http://localhost:8080
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  # Statistics dashboard frontend
  # live on http://localhost:5173
  # Requires the dns server backend to be running on http://localhost:8000, see readme
  dashboard:
    build:
      context: ./dashboard
    container_name: dashboard
    restart: unless-stopped
    ports:
      - 5173:5173
    environment:
      VITE_DEV_API_TARGET: http://host.docker.internal:8000
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./dashboard:/app
      - /app/node_modules