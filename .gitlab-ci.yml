stages:
  - build 
  - test

# Building the project
build:
  stage: build
  image: maven:4.0.0-rc-5-eclipse-temurin-25-alpine
  script:
    - echo "Building the project..."
    - mvn clean compile

tests:
  tags:
  - shared
  stage: test
  image: maven:4.0.0-rc-5-eclipse-temurin-25-alpine
  script:
    - echo "Running blackbox tests..."
    # Run blackbox tests
    # - ./test_server.sh
    # Run unittests
    # -
    - echo "Running unit tests..."
    - mvn test
  artifacts:
    when: always
    paths: 
      - ./target/surefire-reports/**
    reports:
      junit: 
      - ./target/surefire-reports/**
